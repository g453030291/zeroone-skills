<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Anything · 日报</title>
<style>
  :root{
    --bg-a:#080B14; --bg-b:#101827;
    --card:#141A29; --card-2:#0F1420; --card-border:rgba(255,255,255,.07);
    --p1:#3B82F6; --p2:#8B5CF6; --accent:#06B6D4;
    --good:#10B981; --warn:#F59E0B; --bad:#EF4444;
    --text-main:#E5E7EB; --text-sub:#9CA3AF; --text-weak:#6B7280;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(165deg,var(--bg-a),var(--bg-b)) fixed;
    color:var(--text-main);font-family:var(--sans);line-height:1.6;
    min-height:100vh;-webkit-font-smoothing:antialiased;
    padding:clamp(18px,3.5vw,36px) clamp(14px,4vw,24px) 64px;
  }
  ::selection{background:rgba(6,182,212,.35);}
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:#A5F3FC;text-decoration:underline;}
  details>summary{list-style:none;cursor:pointer;}
  details>summary::-webkit-details-marker{display:none;}
  .wrap{max-width:960px;margin:0 auto;position:relative;}

  @keyframes maFlowX{0%{left:-8%;opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{left:104%;opacity:0;}}
  @keyframes maFlowY{0%{top:-10%;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{top:104%;opacity:0;}}

  /* ---------- 悬浮分享按钮 ---------- */
  .share-rail{position:fixed;top:50%;left:50%;transform:translate(calc(min(50vw - 62px, 494px)), -50%);z-index:40;display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .share-btn{display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:18px 11px 20px;font-family:var(--sans);cursor:pointer;box-shadow:0 8px 26px rgba(59,130,246,.32);}
  .share-btn:hover{filter:brightness(1.14);}
  .share-btn .label{writing-mode:vertical-rl;font-size:13px;font-weight:600;letter-spacing:.12em;line-height:1;}
  .share-toast{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--text-sub);white-space:normal;max-width:188px;line-height:1.55;text-align:right;align-self:flex-end;}
  @media (max-width:900px){.share-rail{display:none;}}

  /* ---------- 品牌头 ---------- */
  .brand-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:clamp(16px,3vw,22px);}
  .brand-left{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--p2));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(59,130,246,.35);}
  .brand-mark span{width:10px;height:10px;border-radius:50%;background:#fff;}
  .brand-name{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.25;}
  .brand-tag{font-size:11.5px;color:var(--text-weak);line-height:1.35;}
  .date-switch{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--text-weak);}
  .date-switch select{background:var(--card);color:var(--text-main);border:1px solid var(--card-border);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:11.5px;}

  /* ---------- monitor 切换 ---------- */
  .monitor-switch{margin-bottom:14px;}
  .monitor-switch-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-weak);margin-bottom:9px;}
  .monitor-tabs{display:flex;flex-wrap:wrap;gap:8px;}
  .monitor-tab{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.02);border:1px solid var(--card-border);color:var(--text-sub);border-radius:11px;padding:10px 15px;font-size:13.5px;font-family:var(--sans);cursor:pointer;text-align:left;}
  .monitor-tab .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0;}
  .monitor-tab .name{font-weight:600;}
  .monitor-tab .kind{font-family:var(--mono);font-size:11px;color:var(--text-weak);white-space:nowrap;}
  .monitor-tab.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.45);color:#DBEAFE;}
  .monitor-tab.active .dot{background:#3B82F6;}

  /* ---------- 告警 ---------- */
  .alert-banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;color:#FCA5A5;}

  /* ---------- FOCUS 头部 ---------- */
  .focus-header{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:clamp(18px,3.2vw,26px);margin-bottom:14px;}
  .focus-kind-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:13px;}
  .focus-kind{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px;}
  .focus-kind .dot{width:6px;height:6px;border-radius:50%;}
  .focus-kind-note{font-size:11.5px;color:var(--text-weak);}
  .focus-title{font-size:clamp(21px,4.2vw,32px);font-weight:700;line-height:1.32;margin:0 0 12px;letter-spacing:-.015em;}
  .focus-title .claim{background:linear-gradient(90deg,var(--p1),var(--p2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .focus-overview{color:var(--text-sub);font-size:clamp(13.5px,1.6vw,15px);max-width:680px;margin:0 0 16px;}
  .focus-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .focus-tag{font-size:12px;color:#93C5FD;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);border-radius:999px;padding:4px 11px;}
  .focus-setup{display:flex;gap:10px;border-top:1px dashed var(--card-border);padding-top:14px;}
  .focus-setup .quote{font-size:13px;flex-shrink:0;}
  .focus-setup .text{font-size:12.5px;color:var(--text-weak);line-height:1.6;}

  /* ---------- WORKFLOW ---------- */
  .workflow{background:var(--card-2);border:1px solid var(--card-border);border-radius:16px;padding:clamp(16px,2.8vw,24px);margin-bottom:22px;overflow:hidden;}
  .workflow-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:16px;}
  .workflow-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-weak);}
  .workflow-title{font-size:13.5px;font-weight:600;}
  .workflow-note{font-size:11.5px;color:var(--text-weak);font-family:var(--mono);margin-left:auto;}

  .source-fanin{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(50%,132px),1fr));gap:9px;margin-bottom:6px;}
  .source-card{background:rgba(255,255,255,.025);border:1px solid var(--card-border);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden;}
  .source-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .source-label{font-size:12px;color:var(--text-sub);}
  .source-count{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text-main);}
  .source-track{margin-top:8px;height:2px;border-radius:2px;background:rgba(255,255,255,.06);position:relative;overflow:hidden;}
  .source-fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,182,212,.15),var(--accent));border-radius:2px;}
  .source-dot{position:absolute;top:-1px;width:16px;height:4px;border-radius:2px;background:#A5F3FC;box-shadow:0 0 8px #22D3EE;animation:maFlowX linear infinite;}

  .fan-channel{position:relative;height:26px;margin-bottom:4px;}
  .fan-line{position:absolute;left:0;right:0;top:12px;height:1px;background:linear-gradient(90deg,transparent,rgba(6,182,212,.35),transparent);}
  .fan-drop{position:absolute;width:1px;height:26px;background:linear-gradient(180deg,rgba(6,182,212,.28),rgba(6,182,212,.02));overflow:hidden;}
  .fan-dot{position:absolute;left:-1px;width:3px;height:3px;border-radius:50%;background:#67E8F9;box-shadow:0 0 6px #22D3EE;animation:maFlowY linear infinite;}

  .pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr));gap:2px;}
  .pipeline-node{padding:14px 11px 16px;position:relative;min-width:0;}
  .pipeline-idx{font-family:var(--mono);font-size:10.5px;color:var(--text-weak);letter-spacing:.12em;margin-bottom:8px;}
  .pipeline-label-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .pipeline-label{font-size:13px;font-weight:600;white-space:nowrap;}
  .pipeline-flow-track{flex:1;min-width:14px;height:1px;background:rgba(255,255,255,.09);position:relative;overflow:hidden;}
  .pipeline-flow-dot{position:absolute;top:-1.5px;width:4px;height:4px;border-radius:50%;background:#67E8F9;box-shadow:0 0 7px #22D3EE;animation:maFlowX linear infinite;}
  .pipeline-value{font-family:var(--mono);font-size:clamp(24px,3.4vw,32px);font-weight:700;line-height:1;}
  .pipeline-note{font-size:11px;color:var(--text-weak);margin-top:8px;min-height:30px;}
  .pipeline-retain{font-family:var(--mono);font-size:11px;margin-bottom:7px;}
  .pipeline-bar-track{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
  .pipeline-bar-fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--p2));transition:width 1s ease;}

  /* ---------- 今日结论（决策型，预留） ---------- */
  .advice-section{margin-bottom:32px;}
  .section-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:14px;}
  .section-title{font-size:clamp(16px,2.4vw,19px);font-weight:600;margin:0;}
  .section-sub{font-size:12.5px;color:var(--text-weak);}
  .advice-list{display:flex;flex-direction:column;gap:12px;}
  .advice-card{background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--accent);border-radius:14px;padding:clamp(16px,2.6vw,22px);}
  .advice-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;}
  .advice-action{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;border-radius:5px;padding:3px 8px;}
  .advice-meta{font-size:11.5px;color:var(--text-weak);font-family:var(--mono);}
  .advice-title{font-size:clamp(15px,2vw,17.5px);font-weight:600;line-height:1.45;margin-bottom:9px;}
  .advice-rationale{color:var(--text-sub);font-size:13.5px;margin:0 0 13px;}
  .advice-signals-wrap{border-top:1px dashed var(--card-border);padding-top:12px;}
  .advice-signals-label{font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-weak);margin-bottom:7px;}
  .advice-signal{display:flex;gap:7px;font-size:12.5px;color:var(--text-sub);margin-bottom:5px;}

  .dynamics-divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .dynamics-divider .line{flex:1;height:1px;background:var(--card-border);}
  .dynamics-divider .label{font-size:11.5px;color:var(--text-weak);font-family:var(--mono);letter-spacing:.1em;white-space:nowrap;}

  /* ---------- 今日头条 / 更多动态 ---------- */
  .story-section{margin-bottom:30px;}
  .story-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:clamp(16px,2.6vw,22px);margin-bottom:12px;}
  .story-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:9px;}
  .story-headline{font-size:clamp(15px,2vw,17.5px);font-weight:600;line-height:1.42;}
  .story-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .story-score{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(139,92,246,.15);color:#C4B5FD;white-space:nowrap;}
  .story-summary{color:var(--text-sub);font-size:13.5px;margin:0 0 10px;}
  .story-why{font-size:13px;color:var(--text-main);background:rgba(6,182,212,.06);border-left:3px solid var(--accent);padding:8px 11px;border-radius:0 6px 6px 0;margin-bottom:12px;}
  .story-why .tag{color:var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;}
  .story-sources{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .story-sources a{font-size:12px;color:var(--text-sub);background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:6px;padding:3px 9px;}
  .story-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .story-meta{color:var(--text-weak);font-size:11.5px;font-family:var(--mono);white-space:nowrap;flex-shrink:0;}
  .story-reasoning{flex:1;min-width:140px;}
  .story-reasoning summary{color:var(--text-weak);font-size:12px;}
  .story-reasoning .body{margin-top:7px;color:var(--text-sub);font-size:12.5px;line-height:1.6;}

  .notable-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,258px),1fr));gap:10px;}
  .notable-card{background:rgba(255,255,255,.02);border:1px solid var(--card-border);border-radius:11px;padding:13px 15px;}
  .notable-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:5px;}
  .notable-headline{font-size:13.5px;font-weight:600;line-height:1.42;}
  .notable-score{font-family:var(--mono);font-size:10.5px;flex-shrink:0;color:var(--text-weak);}
  .notable-meta{font-size:11.5px;color:var(--text-weak);margin-bottom:7px;}
  .notable-card details summary{color:var(--accent);font-size:11.5px;}
  .notable-card details .body{margin-top:7px;font-size:12.5px;color:var(--text-sub);}
  .notable-card details .why{font-size:12px;color:var(--text-main);background:rgba(6,182,212,.06);border-left:2px solid var(--accent);padding:6px 9px;border-radius:0 4px 4px 0;margin:7px 0;}
  .notable-more-toggle{margin-top:12px;cursor:pointer;color:var(--text-sub);font-size:12.5px;text-align:center;border:1px solid var(--card-border);border-radius:10px;padding:9px;}
  .notable-more-body{margin-top:10px;}

  /* ---------- 运行详情 ---------- */
  .rundetails{margin-bottom:24px;}
  .rundetails-summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;border:1px solid var(--card-border);border-radius:12px;padding:13px 16px;}
  .rundetails-summary .t{font-size:14px;font-weight:600;}
  .rundetails-summary .s{font-size:12px;color:var(--text-weak);}
  .rundetails-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:12px;}
  .rundetails-block{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px;grid-column:1/-1;}
  .rundetails-label{font-size:12px;color:var(--text-weak);margin-bottom:8px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;}
  .rundetails-desc{color:var(--text-sub);font-size:13px;}

  .filter-example{padding:8px 11px;border-radius:8px;background:rgba(255,255,255,.02);font-size:12.5px;border-left:3px solid #6B7280;margin-bottom:6px;}
  .filter-example.keep{border-left-color:var(--good);}
  .filter-example .mark{font-family:var(--mono);margin-right:6px;}
  .filter-example.keep .mark{color:var(--good);}
  .filter-example:not(.keep) .mark{color:#6B7280;}
  .filter-example .reason{color:var(--text-weak);}

  .leads-summary{font-size:12px;color:var(--text-weak);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;}
  .leads-body{margin-top:10px;max-height:420px;overflow-y:auto;}
  .lead-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--card-border);font-size:12.5px;}
  .lead-row:last-child{border-bottom:none;}
  .lead-idx{font-family:var(--mono);color:var(--text-weak);flex-shrink:0;width:26px;}
  .lead-title a{color:var(--text-main);}
  .lead-meta{color:var(--text-weak);font-size:11px;margin-top:2px;}
  .lead-lc{color:var(--warn);}

  .empty-note{color:var(--text-weak);font-size:13px;padding:8px 0;}

  /* ---------- 复制按钮 ---------- */
  .copy-btn{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--text-sub);background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
  .copy-btn:hover{background:rgba(255,255,255,.07);color:var(--text-main);}
  .copy-btn.copied{color:var(--good);border-color:rgba(16,185,129,.4);}

  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--text-weak);font-size:11.5px;font-family:var(--mono);border-top:1px solid var(--card-border);padding-top:16px;margin-top:8px;}
  footer a{color:var(--text-weak);}

  @media (prefers-reduced-motion:reduce){
    .source-dot,.fan-dot,.pipeline-flow-dot{animation:none !important;opacity:.6;}
  }
</style>

<body>
<div class="wrap" id="app"></div>

<script>
const REPORT_DATA = /*__REPORT_DATA_JSON__*/{};

const STAGE_DEFS=[
  ['①','采集','fetched',null,'接口拉取近24小时增量'],
  ['②','清洗','after_dedup','fetched','按id/URL去重+规范化'],
  ['③','筛选','after_llm_filter','after_dedup','关键词预过滤 + AI 语义复筛'],
  ['④','聚类','clusters','after_llm_filter','归并跨源同事件报道'],
  ['⑤','摘要','selected','clusters','打分+生成为什么相关'],
  ['⑥','生成报告','selected','selected','渲染 HTML'],
];

const OUTPUT_KIND_STYLE = {
  digest:   { color:'#67E8F9', tint:'rgba(6,182,212,.1)',  border:'rgba(6,182,212,.32)' },
  decision: { color:'#C4B5FD', tint:'rgba(139,92,246,.12)', border:'rgba(139,92,246,.4)' },
};

// state：当前查看的日期 + 当前选中的 monitor（切换日期时尽量保留同一个 monitor id）；
// state.mon 是当前渲染用到的完整 monitor 对象，分享按钮要用它拼分享文案。
// state.shareUrl（v2 新增）：这一天的报告如果已经被上传过（scripts/share.py），
// 这里会有一个真正能在浏览器打开的公开链接；没有的话就是空字符串，此时分享按钮
// 只复制文案，不复制 location.href —— 本地文件的 file:// 路径对别人没有意义。
const state = { date: REPORT_DATA.current_date, monitorId: null, mon: null, shareUrl: '' };

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function srcMeta(t){ return (REPORT_DATA.source_labels && REPORT_DATA.source_labels[t]) || {name:t,icon:'📡'}; }

// 双通道复制：优先用 Clipboard API，file:// 直接双击打开的场景下这个 API 可能因为
// 不安全上下文被拒绝，这时退回到 execCommand('copy')。
function copyText(btn){
  const text=btn.dataset.copy;
  const original=btn.textContent;
  const done=()=>{ btn.textContent='已复制'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent=original; btn.classList.remove('copied');},1400); };
  const fail=()=>{ btn.textContent='复制失败'; setTimeout(()=>{btn.textContent=original;},1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done,fail));
  } else {
    fallbackCopy(text,done,fail);
  }
}
function fallbackCopy(text,done,fail){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ fail(); }
  document.body.removeChild(ta);
}
function copyButton(text){
  return `<button type="button" class="copy-btn" data-copy="${esc(text)}" onclick="copyText(this)">复制</button>`;
}
function clusterCopyText(monitorName, date, c){
  const lines=[`${c.headline}（相关度 ${c.score}/10）`];
  if(c.summary){ lines.push('',c.summary); }
  if(c.why_relevant){ lines.push('',`为什么相关：${c.why_relevant}`); }
  if(c.articles && c.articles.length){
    lines.push('','原文：');
    c.articles.forEach(a=>{
      const meta=srcMeta(a.source_type);
      lines.push(`- ${a.title}（${a.feed_name||meta.name}）${a.url}`);
    });
  }
  lines.push('',`来自 monitor-anything 日报 · ${monitorName} · ${date}`);
  return lines.join('\n');
}

// 分享文案：「我正在关注：<monitor 名称>\n今日发现 N 个重要变化」。N 用跨源交叉验证的
// 「今日头条」条数（decision 型 monitor 目前恒无 advice，用 advice 条数兜底，实际不会触发）。
function insightCount(mon){
  if(!mon) return 0;
  if(mon.output_kind === 'decision') return (mon.advice||[]).length;
  return (mon.clusters||[]).filter(c=>c.cross_source).length;
}
function shareText(mon){
  const name = mon ? mon.name : 'Monitor Anything';
  const count = insightCount(mon);
  return `我正在关注：\n${name}\n今日发现 ${count} 个重要变化`;
}

// v3：这个按钮不会自己发网络请求去上传当前页面——dashboard.html 是会被转发出去的
// 静态文件，把能通过鉴权的 token 写进它的 JS 里，等于把 token 一起发给收到文件的
// 任何人。真正的上传由 scripts/share.py 完成，v3 起改成每天渲染完就自动触发一次
// （不用等用户开口要分享），拿到的公开链接会被写回 reports/<date>.json 的 share_url
// 并重新渲染进这份 HTML——所以正常情况下打开这份 HTML 时 state.shareUrl 已经有值，
// 下面 if(publicUrl) 才是最常见的路径；没有值的分支现在代表"今天自动上传失败了"这个
// 边界情况，不是"功能还没触发"（详见 ARCHITECTURE.md §20）。
function shareUrl(){
  const mon = state.mon;
  const text = shareText(mon);
  const publicUrl = state.shareUrl || '';
  const rail = document.getElementById('shareRail');

  if(navigator.share && publicUrl){
    navigator.share({ title: mon ? mon.name : 'Monitor Anything', text, url: publicUrl }).catch(()=>{});
    return;
  }

  const done = (label, toastText)=>{
    const btn = rail.querySelector('.share-btn .label');
    if(btn) btn.textContent = label;
    let toast = rail.querySelector('.share-toast');
    if(!toast){
      toast = document.createElement('div');
      toast.className = 'share-toast';
      rail.appendChild(toast);
    }
    toast.textContent = toastText;
    setTimeout(()=>{
      if(btn) btn.textContent = '分享今日洞察';
      if(toast) toast.remove();
    }, 2400);
  };

  if(publicUrl){
    const payload = `${text}\n\n${publicUrl}`;
    const finish = ()=>done('已复制链接', '链接已复制，发给谁都能看');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).then(finish).catch(finish);
    } else {
      finish();
    }
  } else {
    // 没有公开链接：v3 起这只会在当天的自动上传失败时出现（网络问题/token 过期等），
    // 不是常规路径。本地文件的 file:// 路径对别人没有意义，先复制文案兜底，并提示这是
    // 一次失败后的重试，不是在申请一个还没做的功能。文案要短——toast 贴着屏幕右边缘，
    // 即使现在允许换行、有 max-width 兜底，太长的句子读起来也吃力。
    const finish = ()=>done('已复制文案', '今天的链接生成失败了，跟 Claude 说"重新生成分享链接"再试一次');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(finish);
    } else {
      finish();
    }
  }
}

function animateNumber(el,target){
  const dur=900,start=performance.now(),from=0;
  function step(now){
    const p=Math.min(1,(now-start)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*eased).toLocaleString('zh-CN');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------------------------------------------------------------------
// 各区块构建函数

function buildShareRail(){
  return `<div class="share-rail" id="shareRail">
    <button type="button" class="share-btn" onclick="shareUrl()" title="一键分享给多人">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
        <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
      </svg>
      <span class="label">分享今日洞察</span>
    </button>
  </div>`;
}

function buildBrand(date){
  const dates = REPORT_DATA.dates || [date];
  const opts = dates.map(d=>`<option value="${d}" ${d===date?'selected':''}>${d}</option>`).join('');
  return `<div class="brand-row">
    <div class="brand-left">
      <div class="brand-mark"><span></span></div>
      <div>
        <div class="brand-name">Monitor Anything</div>
        <div class="brand-tag">Understand what matters, not just what happens.</div>
      </div>
    </div>
    <div class="date-switch">
      <span>查看日期</span>
      <select id="dateSelect">${opts}</select>
    </div>
  </div>`;
}

function buildMonitorSwitch(monitors, activeId){
  const count = monitors.length;
  const tabs = monitors.map(m=>{
    const on = m.id === activeId;
    return `<button type="button" class="monitor-tab ${on?'active':''}" data-monitor-id="${esc(m.id)}">
      <span class="dot"></span>
      <span class="name">${esc(m.name)}</span>
      <span class="kind">${esc(m.output_label||'')}</span>
    </button>`;
  }).join('');
  return `<div class="monitor-switch">
    <div class="monitor-switch-label">你的关注点 · ${count} 个${count>1?' · 可切换':''}</div>
    <div class="monitor-tabs">${tabs}</div>
  </div>`;
}

function buildAlerts(report){
  if(!report.alerts || !report.alerts.length) return '';
  return report.alerts.map(a=>`<div class="alert-banner">⚠️ ${esc(a)}</div>`).join('');
}

function buildFocusHeader(mon){
  const kind = OUTPUT_KIND_STYLE[mon.output_kind] || OUTPUT_KIND_STYLE.digest;
  const top = (mon.clusters||[]).filter(c=>c.cross_source);
  const isAdvice = mon.output_kind === 'decision';
  const claim = isAdvice
    ? `今天有 ${(mon.advice||[]).length} 条建议需要你决定`
    : `今天有 ${top.length} 件事值得你关注`;
  const tags = (mon.focus_tags||[]).map(t=>`<span class="focus-tag">${esc(t)}</span>`).join('');
  return `<header class="focus-header">
    <div class="focus-kind-row">
      <span class="focus-kind" style="color:${kind.color};background:${kind.tint};border:1px solid ${kind.border};">
        <span class="dot" style="background:${kind.color};"></span>${esc(mon.output_label||'')}
      </span>
      <span class="focus-kind-note">在你创建这个关注点时就已定下</span>
    </div>
    <h1 class="focus-title">${esc(mon.name)}<br><span class="claim">${esc(claim)}</span></h1>
    <p class="focus-overview">${esc(mon.overview||'')}</p>
    ${tags ? `<div class="focus-tags">${tags}</div>` : ''}
    <div class="focus-setup">
      <span class="quote" style="color:${kind.color};">"</span>
      <div class="text">${esc(mon.setup_note||'')}</div>
    </div>
  </header>`;
}

function buildWorkflow(mon, globalStats){
  const sourcesObj = globalStats.sources || {};
  const entries = Object.entries(sourcesObj);
  const srcMax = Math.max(1, ...entries.map(e=>e[1]));
  const sourceCards = entries.map(([type,count],i)=>{
    const meta = srcMeta(type);
    const pct = Math.max(8, Math.round(count/srcMax*100));
    const dur=(1.9+i*0.3).toFixed(2), delay=(i*0.45).toFixed(2);
    return `<div class="source-card">
      <div class="source-top"><span class="source-label">${meta.icon} ${esc(meta.name)}</span><span class="source-count">${count}</span></div>
      <div class="source-track"><div class="source-fill" style="width:${pct}%;"></div>
        <div class="source-dot" style="animation-duration:${dur}s;animation-delay:${delay}s;"></div>
      </div>
    </div>`;
  }).join('') || '<div class="empty-note">暂无数据</div>';

  const fanDots = Array.from({length:9},(_,i)=>{
    const left = 6+i*11;
    const dur=(1.5+(i%4)*0.35).toFixed(2), delay=((i%6)*0.32).toFixed(2);
    return `<div class="fan-drop" style="left:${left}%;"><div class="fan-dot" style="animation-duration:${dur}s;animation-delay:${delay}s;"></div></div>`;
  }).join('');

  const mstats = mon.stats || {};
  const statValues = { fetched: globalStats.fetched||0, after_dedup: globalStats.after_dedup||0,
    after_llm_filter: mstats.after_llm_filter||0, clusters: mstats.clusters||0, selected: mstats.selected||0 };
  const first = statValues.fetched || 1;

  const nodes = STAGE_DEFS.map(([no,label,key,prevKey,note],i)=>{
    const val = statValues[key]||0;
    const prevVal = prevKey ? (statValues[prevKey]||0) : null;
    const retain = prevVal ? Math.round(val/Math.max(1,prevVal)*100) : null;
    const retainLabel = retain===null ? '全量进入' : (i===STAGE_DEFS.length-1 ? `命中 ${retain}%` : `保留 ${retain}%`);
    const retainColor = retain===null ? 'var(--text-weak)'
      : i===STAGE_DEFS.length-1 ? '#22D3EE'
      : retain>=90 ? 'var(--good)' : retain>=40 ? 'var(--warn)' : '#F87171';
    const color = i>=5 ? '#22D3EE' : i===4 ? '#C4B5FD' : i===3 ? '#93C5FD' : 'var(--text-main)';
    const pct = Math.max(5, Math.round(val/first*100));
    const dur=(2.4+i*0.18).toFixed(2), delay=(i*0.28).toFixed(2);
    return `<div class="pipeline-node">
      <div class="pipeline-idx">${no}</div>
      <div class="pipeline-label-row">
        <span class="pipeline-label">${label}</span>
        <div class="pipeline-flow-track"><div class="pipeline-flow-dot" style="animation-duration:${dur}s;animation-delay:${delay}s;"></div></div>
      </div>
      <div class="pipeline-value" data-target="${val}" style="color:${color};">0</div>
      <div class="pipeline-note">${note}</div>
      <div class="pipeline-retain" style="color:${retainColor};">${retainLabel}</div>
      <div class="pipeline-bar-track"><div class="pipeline-bar-fill" data-pct="${pct}"></div></div>
    </div>`;
  }).join('');

  const totalIn = statValues.fetched;
  const output = statValues.selected;
  const filteredPct = totalIn ? Math.round((1-output/totalIn)*100) : 0;

  return `<section class="workflow">
    <div class="workflow-head">
      <span class="workflow-eyebrow">Workflow</span>
      <span class="workflow-title">海量信源 → 你能用的判断</span>
      <span class="workflow-note">${totalIn} 条输入 → ${output} 条产出，替你过滤掉 ${filteredPct}%</span>
    </div>
    <div class="source-fanin">${sourceCards}</div>
    <div class="fan-channel"><div class="fan-line"></div>${fanDots}</div>
    <div class="pipeline">${nodes}</div>
  </section>`;
}

function buildAdvice(mon){
  const advice = mon.advice || [];
  if(mon.output_kind !== 'decision' || !advice.length) return '';
  const tone = { good:{color:'var(--good)',tint:'rgba(16,185,129,.12)'}, warn:{color:'var(--warn)',tint:'rgba(245,158,11,.12)'}, info:{color:'var(--accent)',tint:'rgba(6,182,212,.12)'} };
  const cards = advice.map(a=>{
    const t = tone[a.tone] || tone.info;
    const signals = (a.signals||[]).map(s=>`<div class="advice-signal"><span style="color:${t.color};flex-shrink:0;">→</span><span>${esc(s)}</span></div>`).join('');
    return `<div class="advice-card" style="border-left-color:${t.color};">
      <div class="advice-top">
        <span class="advice-action" style="color:${t.color};background:${t.tint};">${esc(a.action||'')}</span>
        <span class="advice-meta">窗口 ${esc(a.window||'')} · 置信度 ${esc(a.confidence||'')}</span>
      </div>
      <div class="advice-title">${esc(a.title||'')}</div>
      <p class="advice-rationale">${esc(a.rationale||'')}</p>
      <div class="advice-signals-wrap">
        <div class="advice-signals-label">依据 · 来自今日动态</div>
        ${signals}
      </div>
    </div>`;
  }).join('');
  return `<section class="advice-section">
    <div class="section-head"><h2 class="section-title">今日结论</h2><span class="section-sub">该做什么、什么时候做 —— 依据附在每条下面</span></div>
    <div class="advice-list">${cards}</div>
  </section>`;
}

function articleLine(a){
  const meta = srcMeta(a.source_type);
  return `<a href="${esc(a.url)}" target="_blank" rel="noopener">${meta.icon} ${esc(a.feed_name||meta.name)}</a>`;
}

function buildTopStories(mon, date){
  const top = (mon.clusters||[]).filter(c=>c.cross_source).sort((a,b)=>b.score-a.score);
  const isAdvice = mon.output_kind === 'decision';
  const heading = isAdvice ? '关键动态' : '今日头条';
  const cards = top.map(c=>{
    const srcCount = new Set((c.articles||[]).map(a=>a.source_type)).size;
    return `<div class="story-card">
      <div class="story-top">
        <div class="story-headline">${esc(c.headline)}</div>
        <div class="story-head-right"><span class="story-score">${c.score}/10</span>${copyButton(clusterCopyText(mon.name,date,c))}</div>
      </div>
      <p class="story-summary">${esc(c.summary)}</p>
      <div class="story-why"><span class="tag">为什么给你看</span><br>${esc(c.why_relevant)}</div>
      <div class="story-sources">${(c.articles||[]).map(articleLine).join('')}</div>
      <div class="story-meta-row">
        <span class="story-meta">${(c.articles||[]).length} 篇 · ${srcCount} 个独立渠道</span>
        <details class="story-reasoning"><summary>AI 判断依据 ▾</summary><div class="body">${esc(c.ai_reasoning||'')}</div></details>
      </div>
    </div>`;
  }).join('') || '<div class="empty-note">今天没有跨源交叉验证的动态。</div>';
  return `<section class="story-section">
    <div class="section-head"><h2 class="section-title">${heading}</h2><span class="section-sub">跨多个独立信源交叉验证 · ${top.length} 条</span></div>
    ${cards}
  </section>`;
}

function notableCard(item, mon, date){
  const srcSuffix = item.articles.length>1 ? ` · 等 ${item.articles.length} 篇` : '';
  const first = item.articles[0]||{};
  const meta = srcMeta(first.source_type);
  return `<div class="notable-card">
    <div class="notable-top"><div class="notable-headline">${esc(item.headline)}</div><span class="notable-score">${item.score}/10</span></div>
    <div class="notable-meta">${meta.icon} ${esc(first.feed_name||meta.name)}${srcSuffix}</div>
    <details>
      <summary>展开详情 ▾</summary>
      <div class="body">${esc(item.summary)}</div>
      <div class="why">${esc(item.why_relevant)}</div>
      <a href="${esc(first.url)}" target="_blank" rel="noopener">查看原文 →</a>
    </details>
  </div>`;
}

function buildNotableDynamics(mon, date, visibleN){
  const rest = (mon.clusters||[]).filter(c=>!c.cross_source).sort((a,b)=>b.score-a.score);
  if(!rest.length) return '';
  const visible = rest.slice(0, visibleN);
  const overflow = rest.slice(visibleN);
  const visibleCards = visible.map(c=>notableCard(c, mon, date)).join('');
  const overflowCards = overflow.length ? `<details class="notable-more">
    <summary class="notable-more-toggle">展开剩余 ${overflow.length} 条 ▾</summary>
    <div class="notable-grid notable-more-body">${overflow.map(c=>notableCard(c, mon, date)).join('')}</div>
  </details>` : '';
  return `<section class="story-section">
    <div class="section-head"><h2 class="section-title">更多动态</h2><span class="section-sub">单信源报道，供你补充背景 · ${rest.length} 条</span></div>
    <div class="notable-grid">${visibleCards}</div>
    ${overflowCards}
  </section>`;
}

function buildRunDetails(mon){
  const examples = (mon.filter_examples||[]).map(ex=>{
    const keep = ex.action === 'keep';
    return `<div class="filter-example ${keep?'keep':''}">
      <span class="mark">${keep?'✓ 保留':'✗ 排除'}</span>「${esc(ex.title)}」
      <span class="reason"> — ${esc(ex.reason)}</span>
    </div>`;
  }).join('') || '<div class="empty-note">暂无筛选实例。</div>';

  const leads = mon.leads||[];
  const leadRows = leads.map((l,i)=>{
    const meta = srcMeta(l.source_type);
    const lc = l.low_confidence ? '<span class="lead-lc"> 低置信度</span>' : '';
    const titleHtml = l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${meta.icon} ${esc(l.title)}</a>` : `${meta.icon} ${esc(l.title)}`;
    return `<div class="lead-row">
      <div class="lead-idx">${String(i+1).padStart(2,'0')}</div>
      <div class="lead-title">${titleHtml}${lc}<div class="lead-meta">${esc(l.feed_name||meta.name)} · ${esc(l.reason||'')}</div></div>
    </div>`;
  }).join('') || '<div class="empty-note">暂无长尾线索。</div>';

  return `<section class="rundetails">
    <details>
      <summary class="rundetails-summary"><span class="t">运行详情</span><span class="s">关注点定义 · AI 筛选实例 · 长尾线索 ${leads.length} 条</span></summary>
      <div class="rundetails-body">
        <div class="rundetails-block">
          <div class="rundetails-label">关注点定义</div>
          <div class="rundetails-desc">${esc(mon.description||'')}</div>
        </div>
        <div class="rundetails-block">
          <div class="rundetails-label">AI 筛选实例</div>
          ${examples}
        </div>
        <div class="rundetails-block">
          <details>
            <summary class="leads-summary">长尾线索 ${leads.length} 条 ▾</summary>
            <div class="leads-body">${leadRows}</div>
          </details>
        </div>
      </div>
    </details>
  </section>`;
}

function buildFooter(date, generatedAt){
  return `<footer>
    <div>Monitor Anything · 零一实验室 · <a href="https://lingyilabs.com/" target="_blank" rel="noopener">lingyilabs.com</a></div>
    <div>${date} · 生成于 ${esc(generatedAt||'')}</div>
  </footer>`;
}

// ---------------------------------------------------------------------
// 主渲染

function render(date, monitorId){
  const report = REPORT_DATA.reports[date];
  const app = document.getElementById('app');
  if(!report){ app.innerHTML = '<p>没有找到这一天的报告。</p>'; return; }
  const monitors = report.monitors || [];
  if(!monitors.length){
    app.innerHTML = buildShareRail() + buildBrand(date) + buildAlerts(report) + '<div class="empty-note">这一天还没有配置任何关注点。</div>' + buildFooter(date, report.generated_at);
    return;
  }
  let mon = monitors.find(m=>m.id === monitorId) || monitors[0];
  state.date = date;
  state.monitorId = mon.id;
  state.mon = mon;
  state.shareUrl = report.share_url || '';

  app.innerHTML = [
    buildShareRail(),
    buildBrand(date),
    buildMonitorSwitch(monitors, mon.id),
    buildAlerts(report),
    buildFocusHeader(mon),
    buildWorkflow(mon, report.stats||{}),
    buildAdvice(mon),
    mon.output_kind==='decision' && (mon.advice||[]).length ? `<div class="dynamics-divider"><div class="line"></div><span class="label">以下是支撑上述结论的今日动态</span><div class="line"></div></div>` : '',
    buildTopStories(mon, date),
    buildNotableDynamics(mon, date, 5),
    buildRunDetails(mon),
    buildFooter(date, report.generated_at),
  ].join('');

  document.getElementById('dateSelect').addEventListener('change', e=>{
    const newDate = e.target.value;
    render(newDate, state.monitorId);
  });
  document.querySelectorAll('.monitor-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>render(state.date, btn.dataset.monitorId));
  });

  document.querySelectorAll('.pipeline-value').forEach(el=>animateNumber(el, parseInt(el.dataset.target||'0',10)));
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll('.pipeline-bar-fill').forEach(el=>{ el.style.width = el.dataset.pct+'%'; });
    }, 80);
  });
}

render(state.date, null);
